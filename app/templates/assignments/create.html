{% extends "base.html" %}

{% block title %}Créer une affectation RFID{% endblock %}

{% block page_content %}
<div class="container py-4">
    <div class="mb-4">
        <h1 class="h3 mb-1">Créer une affectation RFID</h1>
        <p class="text-muted mb-0">Associer une carte RFID à un utilisateur autorisé</p>
    </div>

    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body">
            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/assignments/create" class="row g-3">
                <div class="col-md-6">
                    <label for="rfid_card_id" class="form-label">Carte RFID</label>
                    <select class="form-select" id="rfid_card_id" name="rfid_card_id" required>
                        <option value="">Choisir une carte</option>
                        {% for card in cards %}
                        <option value="{{ card.id }}"
                                {% if form_data.get('rfid_card_id') == card.id %}selected{% endif %}>
                            {{ card.uid }}{% if card.card_label %} - {{ card.card_label }}{% endif %} ({{ card.status }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="authorized_user_id" class="form-label">Utilisateur autorisé</label>
                    <select class="form-select" id="authorized_user_id" name="authorized_user_id" required>
                        <option value="">Choisir un utilisateur</option>
                        {% for user in users %}
                        <option value="{{ user.id }}"
                                {% if form_data.get('authorized_user_id') == user.id %}selected{% endif %}>
                            {{ user.first_name }} {{ user.last_name }}
                            {% if user.reference_code %} - {{ user.reference_code }}{% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-4">
                    <label for="assigned_at" class="form-label">Date d’attribution</label>
                    <input type="datetime-local" class="form-control" id="assigned_at" name="assigned_at"
                           value="{{ form_data.get('assigned_at', '') }}">
                </div>

                <div class="col-md-4">
                    <label for="expired_at" class="form-label">Date d’expiration</label>
                    <input type="datetime-local" class="form-control" id="expired_at" name="expired_at"
                           value="{{ form_data.get('expired_at', '') }}">
                </div>

                <div class="col-md-4">
                    <label for="status" class="form-label">Statut</label>
                    <select class="form-select" id="status" name="status" required>
                        {% for item in statuses %}
                        <option value="{{ item }}" {% if form_data.get('status', 'active') == item %}selected{% endif %}>
                            {{ item }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-12">
                    <label for="notes" class="form-label">Notes</label>
                    <textarea class="form-control" id="notes" name="notes" rows="4">{{ form_data.get('notes', '') }}</textarea>
                </div>

                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                    <a href="/assignments" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

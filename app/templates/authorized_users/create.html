{% extends "base.html" %}

{% block title %}Créer un utilisateur autorisé{% endblock %}

{% block page_content %}
<div class="container py-4">
    <div class="mb-4">
        <h1 class="h3 mb-1">Créer un utilisateur autorisé</h1>
        <p class="text-muted mb-0">Ajout d’une nouvelle personne autorisée à accéder à la porte</p>
    </div>

    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body">
            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/authorized-users/create" class="row g-3">
                <div class="col-md-6">
                    <label for="first_name" class="form-label">Prénom</label>
                    <input type="text" class="form-control" id="first_name" name="first_name"
                           value="{{ form_data.get('first_name', '') }}" required>
                </div>

                <div class="col-md-6">
                    <label for="last_name" class="form-label">Nom</label>
                    <input type="text" class="form-control" id="last_name" name="last_name"
                           value="{{ form_data.get('last_name', '') }}" required>
                </div>

                <div class="col-md-4">
                    <label for="gender" class="form-label">Genre</label>
                    <input type="text" class="form-control" id="gender" name="gender"
                           value="{{ form_data.get('gender', '') }}">
                </div>

                <div class="col-md-4">
                    <label for="phone" class="form-label">Téléphone</label>
                    <input type="text" class="form-control" id="phone" name="phone"
                           value="{{ form_data.get('phone', '') }}">
                </div>

                <div class="col-md-4">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email"
                           value="{{ form_data.get('email', '') }}">
                </div>

                <div class="col-md-6">
                    <label for="reference_code" class="form-label">Code de référence</label>
                    <input type="text" class="form-control" id="reference_code" name="reference_code"
                           value="{{ form_data.get('reference_code', '') }}">
                </div>

                <div class="col-md-3">
                    <label for="valid_from" class="form-label">Valide à partir de</label>
                    <input type="datetime-local" class="form-control" id="valid_from" name="valid_from"
                           value="{{ form_data.get('valid_from', '') }}">
                </div>

                <div class="col-md-3">
                    <label for="valid_until" class="form-label">Valide jusqu’à</label>
                    <input type="datetime-local" class="form-control" id="valid_until" name="valid_until"
                           value="{{ form_data.get('valid_until', '') }}">
                </div>

                <div class="col-12">
                    <label for="notes" class="form-label">Notes</label>
                    <textarea class="form-control" id="notes" name="notes" rows="4">{{ form_data.get('notes', '') }}</textarea>
                </div>

                <div class="col-12">
                    <div class="form-check">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="is_active"
                            name="is_active"
                            {% if form_data.get('is_active', True) %}checked{% endif %}
                        >
                        <label class="form-check-label" for="is_active">
                            Utilisateur actif
                        </label>
                    </div>
                </div>

                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                    <a href="/authorized-users" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
